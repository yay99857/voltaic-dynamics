plugins {
    id 'java-library'
    id 'eclipse'
    id 'idea'
    id 'maven-publish'
    id 'net.neoforged.moddev' version '2.0.148'
}

version = project.mod_version
group = project.mod_group_id

base {
    archivesName = project.mod_id
}

java.toolchain.languageVersion = JavaLanguageVersion.of(25)

// Datagen output is part of the mod's resources.
sourceSets.main.resources {
    srcDir 'src/generated/resources'
    exclude '.cache/'
}

neoForge {
    version = project.neo_version

    runs {
        client {
            client()
            systemProperty 'neoforge.enabledGameTestNamespaces', project.mod_id
            // ./gradlew runClient -PquickPlay="World Name" : opens that save directly (used for the showcase world)
            if (project.hasProperty('quickPlay')) {
                programArguments.addAll '--quickPlaySingleplayer', project.property('quickPlay').toString()
            }
        }
        server {
            server()
            programArgument '--nogui'
            systemProperty 'neoforge.enabledGameTestNamespaces', project.mod_id
        }
        // ./gradlew runPackServer : a dedicated server with this mod plus the Bubie Pack's server mods, to catch
        // conflicts before shipping. tools/prepare-pack-server.sh fills runs/pack-server/mods first.
        packServer {
            server()
            gameDirectory = project.file('runs/pack-server')
            programArgument '--nogui'
            // Dev runs register game tests, which loads other mods' test classes; some reference optional mods the
            // pack lacks and crash. Only ours are registered here; a real server never loads any.
            systemProperty 'neoforge.enabledGameTestNamespaces', project.mod_id
            jvmArgument '-Xmx3G'
        }
        // ./gradlew runPackClient : a client with the same mods, to join runPackServer at localhost.
        packClient {
            client()
            gameDirectory = project.file('runs/pack-client')
            systemProperty 'neoforge.enabledGameTestNamespaces', project.mod_id
            jvmArgument '-Xmx4G'
            // Dev runs enable Java assertions; Jade then asserts that every plugin (Pipez's included) has its
            // config translations and crashes the menu. Players never run with assertions.
            jvmArgument '-da'
        }
        // ./gradlew runCompatGameTestServer : the game tests with the mods in runs/compat/mods (storage, pipes,
        // recipe viewers...), to check that our blocks work with them. Fill that folder with the 26.3 jars first.
        compatGameTestServer {
            type = "gameTestServer"
            gameDirectory = project.file('runs/compat')
            systemProperty 'neoforge.enabledGameTestNamespaces', project.mod_id
        }
        // ./gradlew runCompatClient : a client with the same mods, to look at JEI, Jade and the GUIs by hand.
        compatClient {
            client()
            gameDirectory = project.file('runs/compat')
            // Opens (or creates) the "Compat Test" world straight away.
            programArguments.addAll '--quickPlaySingleplayer', 'Compat Test'
            systemProperty 'neoforge.enabledGameTestNamespaces', project.mod_id
            jvmArgument '-da'
        }
        // ./gradlew runGameTestServer : runs every @GameTest and exits (non-zero on failure)
        gameTestServer {
            type = "gameTestServer"
            systemProperty 'neoforge.enabledGameTestNamespaces', project.mod_id
        }
        // ./gradlew runData : regenerates tags, loot tables and recipes into src/generated/resources
        data {
            clientData()
            programArguments.addAll '--mod', project.mod_id, '--all',
                    '--output', file('src/generated/resources/').getAbsolutePath(),
                    '--existing', file('src/main/resources/').getAbsolutePath()
        }
    }

    mods {
        "${project.mod_id}" {
            sourceSet(sourceSets.main)
        }
    }
}

repositories {
    mavenLocal()
    mavenCentral()
    // JEI and Jade builds for 26.3 (compiled against only; the compat runs load the jars from runs/compat/mods).
    maven {
        url = 'https://api.modrinth.com/maven'
        content { includeGroup 'maven.modrinth' }
    }
    maven {
        url = 'https://cursemaven.com'
        content { includeGroup 'curse.maven' }
    }
}

dependencies {
    // Optional integrations: compiled against, never required at runtime (see compat/*).
    compileOnly 'maven.modrinth:jei:31.23.0.130'            // JEI for 26.3
    compileOnly 'maven.modrinth:jade:26.3.5+neoforge'       // Jade for 26.3
    // The other mods (JEI, Jade, storage mods...) are loaded at runtime only by runCompatClient and
    // runCompatGameTestServer, from runs/compat/mods. Mekanism has no 26.3 build yet, so CompatGameTests skip it.
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
}

// Fills the ${...} placeholders in neoforge.mods.toml from gradle.properties, so versions live in one place.
var modMetadata = [
        mod_id               : mod_id,
        mod_name             : mod_name,
        mod_version          : mod_version,
        mod_license          : mod_license,
        mod_authors          : mod_authors,
        mod_description      : mod_description,
        minecraft_version_range: minecraft_version_range,
        neo_version_range    : neo_version_range,
        loader_version_range : loader_version_range,
]
processResources {
    inputs.properties modMetadata
    filesMatching('META-INF/neoforge.mods.toml') {
        expand modMetadata
    }
}

// EMI has no 26.3 build yet: its integration is left out until it does.
sourceSets.main.java {
    exclude 'com/voltaicdynamics/compat/emi/**'
}
