plugins {
    id 'java-library'
    id 'eclipse'
    id 'idea'
    id 'maven-publish'
    id 'net.neoforged.moddev' version '2.0.148'
}

version = project.mod_version
group = project.mod_group_id

base {
    archivesName = project.mod_id
}

java.toolchain.languageVersion = JavaLanguageVersion.of(21)

// Datagen output is part of the mod's resources.
sourceSets.main.resources {
    srcDir 'src/generated/resources'
    exclude '.cache/'
}

neoForge {
    version = project.neo_version

    runs {
        client {
            client()
            systemProperty 'neoforge.enabledGameTestNamespaces', project.mod_id
            // ./gradlew runClient -PquickPlay="World Name" : opens that save directly (used for the showcase world)
            if (project.hasProperty('quickPlay')) {
                programArguments.addAll '--quickPlaySingleplayer', project.property('quickPlay').toString()
            }
        }
        server {
            server()
            programArgument '--nogui'
            systemProperty 'neoforge.enabledGameTestNamespaces', project.mod_id
        }
        // ./gradlew runPackServer : a dedicated server with this mod plus the Bubie Pack's server mods, to catch
        // conflicts before shipping. tools/prepare-pack-server.sh fills runs/pack-server/mods first.
        packServer {
            server()
            gameDirectory = project.file('runs/pack-server')
            programArgument '--nogui'
            // Dev runs register game tests, which loads other mods' test classes; some reference optional mods the
            // pack lacks and crash. Only ours are registered here; a real server never loads any.
            systemProperty 'neoforge.enabledGameTestNamespaces', project.mod_id
            jvmArgument '-Xmx3G'
        }
        // ./gradlew runPackClient : a client with the same mods, to join runPackServer at localhost.
        packClient {
            client()
            gameDirectory = project.file('runs/pack-client')
            systemProperty 'neoforge.enabledGameTestNamespaces', project.mod_id
            jvmArgument '-Xmx4G'
            // Dev runs enable Java assertions; Jade then asserts that every plugin (Pipez's included) has its
            // config translations and crashes the menu. Players never run with assertions.
            jvmArgument '-da'
        }
        // ./gradlew runGameTestServer : runs every @GameTest and exits (non-zero on failure)
        gameTestServer {
            type = "gameTestServer"
            systemProperty 'neoforge.enabledGameTestNamespaces', project.mod_id
        }
        // ./gradlew runData : regenerates tags, loot tables and recipes into src/generated/resources
        data {
            data()
            programArguments.addAll '--mod', project.mod_id, '--all',
                    '--output', file('src/generated/resources/').getAbsolutePath(),
                    '--existing', file('src/main/resources/').getAbsolutePath()
        }
    }

    mods {
        "${project.mod_id}" {
            sourceSet(sourceSets.main)
        }
    }
}

repositories {
    mavenLocal()
    mavenCentral()
    // JEI, EMI and Jade at the exact versions shipped in Bubie Pack (CurseForge file ids).
    maven {
        url = 'https://cursemaven.com'
        content { includeGroup 'curse.maven' }
    }
}

dependencies {
    // Optional integrations: compiled against, never required at runtime (see compat/*).
    compileOnly 'curse.maven:jei-238222:9205121'    // JEI 19.64.0.455
    compileOnly 'curse.maven:emi-580555:8081408'    // EMI 1.1.24
    compileOnly 'curse.maven:jade-324717:8591319'   // Jade 15.10.6
    // Loaded in runClient / runServer / runGameTestServer so the integrations are exercised in dev.
    runtimeOnly 'curse.maven:jei-238222:9205121'
    runtimeOnly 'curse.maven:emi-580555:8081408'
    runtimeOnly 'curse.maven:jade-324717:8591319'
    // Dev only: Mekanism supplies iron/copper dust (Voltaic Dust recipe) and FE machines to test cables against.
    runtimeOnly 'curse.maven:mekanism-268560:7904058'            // Mekanism 10.7.19
    runtimeOnly 'curse.maven:mekanism-generators-268566:7904061' // Mekanism Generators 10.7.19
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
}

// Fills the ${...} placeholders in neoforge.mods.toml from gradle.properties, so versions live in one place.
var modMetadata = [
        mod_id               : mod_id,
        mod_name             : mod_name,
        mod_version          : mod_version,
        mod_license          : mod_license,
        mod_authors          : mod_authors,
        mod_description      : mod_description,
        minecraft_version_range: minecraft_version_range,
        neo_version_range    : neo_version_range,
        loader_version_range : loader_version_range,
]
processResources {
    inputs.properties modMetadata
    filesMatching('META-INF/neoforge.mods.toml') {
        expand modMetadata
    }
}
